[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nps-cli"
version = "0.1.4"
description = "A simple CLI for sampling point clouds from large volumetric datasets"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jakob Troidl" }]
dependencies = [
    "click",
    # 12.13.x passes the nominal chunk size instead of the real cutout size to
    # the compressed_segmentation decoder for sharded chunks; partial chunks at
    # the volume edge then segfault (fixed again in 12.14).
    "cloud-volume!=12.13.*",
    # Pinned to an exact commit of the AI-HHMI fork
    "volara @ git+https://github.com/AI-HHMI/volara.git@e99542764b377c058d7b90cbfab10eeb09ccb1ea",
    "pocaduck",
]

classifiers = [
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "build",
    "twine",
    "ruff"
]

[project.entry-points."volara.blockwise_tasks"]
sample-points = "nps.blockwise:SamplePoints"

[project.scripts]
nps = "nps.main:main"

[tool.setuptools.packages.find]
include = ["nps*"]

[tool.ruff]
exclude = ["dist", "build", "nps.egg-info", "volara_logs", "nps_output"]
line-length = 88
target-version = "py311"
